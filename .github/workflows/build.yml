name: ANEM PLUS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: unzip -q ANEM_PLUS_Source.zip -d project

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          WRAPPER=$(find project -type f -name gradlew | head -n 1)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew not found in ZIP"
            exit 1
          fi

          DIR=$(dirname "$WRAPPER")
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANEM-PLUS-APK
          path: project/**/build/outputs/apk/debug/*.apk
