name: ANEM PLUS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -q ANEM_PLUS_Source.zip -d project

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Gradle Wrapper
        run: |
          WRAPPER=$(find project -type f -name gradlew | head -n 1)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew not found!"
            find project -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "WRAPPER_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$WRAPPER_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANEM-PLUS-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
